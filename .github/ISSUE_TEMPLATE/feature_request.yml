name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Note: Viboplr is plugin-first. Features that fetch external data, add an
        information section, or integrate a service are usually best built as a
        plugin — see [PLUGIN-API-REFERENCE.md](../../blob/main/PLUGIN-API-REFERENCE.md).
        Requests like that are welcome too; they may be answered with "great plugin idea".
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you miss this feature.
      placeholder: When I'm listening to a long playlist, I want to …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other ways this could be done.
    validations:
      required: false
