name: CI

on:
  workflow_dispatch:
  pull_request:

# A newer push to the same PR supersedes the run in progress — e.g. the libmpv
# update bot pushes the pin, then the engine-component lock minutes later, and
# only the second commit's run is ever read.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npx tsc --noEmit
      # Gates on errors only; warnings are a declared backlog (see eslint.config.js).
      - run: npm run lint

  rust-check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        timeout-minutes: 45
        run: scripts/ci-install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # The Linux job never compiles the `#[cfg(windows)]` code (WebView2 mute,
  # WASAPI bit-perfect, the wid video layer), and `npm run bump` checks on
  # macOS — so without this a Windows-only break first shows up in the release
  # build, after the tag is out (v1.0.112-beta.7: a Tauri upgrade moved
  # webview2-com and left our pin behind). `--all-targets` covers the
  # Windows-gated tests too.
  rust-check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # tauri.windows.conf.json bundles libmpv-2.dll as a resource, and
      # tauri-build fails the build script when a resource path is missing.
      - name: Vendor libmpv
        run: node scripts/fetch-libmpv.mjs

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

  test-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm test
