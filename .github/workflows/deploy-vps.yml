name: Deploy Site to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          # Diagnostics: say *why* the host is unreachable instead of a bare exit 1.
          echo "Runner public IP: $(curl -s -m 5 https://api.ipify.org || echo unknown)"
          echo "VPS_HOST resolves to:"
          getent ahosts "$VPS_HOST" | awk '{print "  " $1}' | sort -u || echo "  (does not resolve)"
          echo "TCP check on port $PORT:"
          timeout 10 bash -c "</dev/tcp/$VPS_HOST/$PORT" \
            && echo "  open" || echo "  NOT reachable (closed, filtered or timed out)"
          if ! ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" > /tmp/keyscan.out 2> /tmp/keyscan.err \
             || [ ! -s /tmp/keyscan.out ]; then
            echo "::error::ssh-keyscan got no host key from VPS_HOST:$PORT"
            sed 's/^/  keyscan: /' /tmp/keyscan.err
            exit 1
          fi
          cat /tmp/keyscan.out >> ~/.ssh/known_hosts

      - name: Deploy docs/ via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            docs/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
