name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Release commits ("release: vX.Y.Z") are deployed by release.yml instead,
    # AFTER both installers have built and uploaded — otherwise the site would
    # advertise download URLs that don't exist yet (or never will, if a
    # platform build fails). Ordinary docs edits and manual dispatches deploy
    # immediately as before.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'release:')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
