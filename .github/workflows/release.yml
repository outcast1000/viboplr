name: Release

on:
  push:
    tags:
      # Version tags only (v1.0.95, v1.1.0-beta.1). A bare 'v*' also matched
      # 'vendor-libmpv' — the libmpv mirror's release tag — and started an app
      # release when that tag was pushed.
      - 'v[0-9]*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # Fast and apt-free on purpose: it only names the tag and opens the release
  # as a DRAFT, so the platform builds start within a minute of the push. The
  # Linux tests used to run here in front of the builds, and when the Ubuntu
  # mirror stalled (2026-10-23: 35 min, then 40+) both builds waited on a
  # package download they don't need.
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
      release-id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Get tag
        id: get-tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        shell: bash
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          if [ -n "$TAG" ]; then
            node scripts/generate-changelog.mjs "$TAG" > /tmp/release-body.md
          else
            echo "Initial release." > /tmp/release-body.md
          fi

      # A DRAFT is invisible to every update path — stable resolves
      # releases/latest and the beta channel skips drafts — so nothing reaches a
      # user until `publish` flips it, after the tests AND both builds passed.
      # On a re-run the release already exists (still a draft, or published if
      # the earlier run got that far) and is reused either way.
      - name: Create draft release
        id: create-release
        if: steps.get-tag.outputs.tag != ''
        shell: bash
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          # Hyphenated tags (v1.2.3-mpv.1, -beta.1, …) become PRERELEASES:
          # GitHub's releases/latest — which the auto-updater endpoints resolve —
          # skips prereleases, so branch/test builds can never reach real users.
          PRERELEASE=false
          if [[ "$TAG" == *-* ]]; then PRERELEASE=true; fi
          # Reuse before creating: GitHub allows any number of DRAFTS per tag,
          # so creating on a re-run doesn't fail, it makes a second draft — and
          # beta.9's re-run split its assets across two (macOS in one, Windows
          # in the other). A published release for the tag wins over a draft.
          # A draft can't be fetched by tag, only found in the list.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.draft) \(.id)\"" \
            | sort | head -n1 | cut -d' ' -f2)
          if [ -n "$ID" ]; then
            echo "Reusing release $ID for $TAG"
          else
            # Create through the API so the response carries the id: looking a
            # just-made draft up in the list raced the list's catch-up (beta.9's
            # first run: "No release found" a second after creating it).
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="Vibo $TAG" \
              -F body=@/tmp/release-body.md \
              -F draft=true \
              -F prerelease=$PRERELEASE \
              --jq '.id')
            echo "Created draft release $ID"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs alongside the builds instead of in front of them. It still gates the
  # release: `publish` needs it, so a failing test leaves the release a draft.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        timeout-minutes: 45
        run: scripts/ci-install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: TypeScript tests
        run: npm test

  build:
    needs: prepare
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Single build per platform. The native engine is compiled into every
      # build and libmpv is bundled from the vendored artifact (fetched below);
      # the per-platform tauri.{macos,windows}.conf.json overlays are auto-merged
      # by the Tauri CLI. There is no separate "Full"/lean flavor.
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      # Bundle libmpv: fetch the pinned, SHA-256-verified vendored artifact for
      # this runner's platform into src-tauri/vendor/libmpv/<platform>/. The
      # tauri.{macos,windows}.conf.json overlays (auto-merged by the CLI) point
      # bundle.macOS.frameworks / bundle.resources at these files.
      - name: Vendor libmpv
        run: node scripts/fetch-libmpv.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          # Baked into the binary at compile time via option_env! (see
          # src-tauri/src/telemetry.rs). Requires the APTABASE_APP_KEY repo secret;
          # without it CI builds bake no key and telemetry is a silent no-op.
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Vibo ${{ needs.prepare.outputs.tag }}'
          releaseBody: ''
          # Upload into exactly prepare's release. With releaseId set,
          # tauri-action skips its own by-tag lookup — which, with two drafts
          # for one tag, let the two platforms pick different ones. tagName
          # still matters: it rewrites the draft's `untagged-…` asset URLs in
          # latest.json to /download/<tag>/, so the updater manifest stays
          # valid once `publish` flips the draft.
          releaseId: ${{ needs.prepare.outputs.release-id }}
          releaseDraft: true
          # Keep in sync with the create-release step: hyphenated tags = prerelease.
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The only step that makes a release visible. Needing `test` and `build`
  # means a failed test or a failed platform build leaves it a draft — beta.7
  # went out macOS-only because the release was public before either build ran.
  publish:
    needs: [prepare, test, build]
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the draft
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          # Prereleases can't be "latest"; a stable release becomes it.
          LATEST=true
          if [[ "$TAG" == *-* ]]; then LATEST=false; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release-id }}" \
            -F draft=false -f make_latest=$LATEST --jq '.html_url'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-site:
    # Publish viboplr.com only once the release is public — i.e. after BOTH
    # platform builds uploaded their installers and the tests passed. pages.yml deliberately skips the release commit's push event
    # (see the `if` there), so this dispatch is what deploys a release's site
    # update — the site never advertises assets that don't exist. Dispatching
    # pages.yml (rather than inlining the deploy steps here) keeps a single
    # deploy definition and runs it on `main`, which the github-pages
    # environment's branch policy allows — this workflow runs on a tag ref,
    # which it may not.
    # Betas skip this: bump.mjs makes no site changes for hyphenated versions,
    # so there is nothing to deploy.
    needs: [prepare, publish]
    if: needs.prepare.outputs.tag != '' && !contains(needs.prepare.outputs.tag, '-')
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages deploy
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
