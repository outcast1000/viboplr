name: Umami check (one-off)

# One-off: confirm community.viboplr.com's tracker reaches Umami. Logs in with
# the admin secret from the runner and prints the last 24h of that website's
# page views and events — counts only, no secrets. Remove after use.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Umami
        env:
          UMAMI_ADMIN_PASSWORD: ${{ secrets.UMAMI_ADMIN_PASSWORD }}
        run: |
          node - <<'EOF'
          const BASE = "https://stats.viboplr.com/api";
          const SITE = "042509a9-88c1-4011-a88f-0f8a0eac0ecb"; // community.viboplr.com
          const call = async (path, token, body) => {
            const res = await fetch(BASE + path, {
              method: body ? "POST" : "GET",
              headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) },
              body: body ? JSON.stringify(body) : undefined,
            });
            const text = await res.text();
            let data; try { data = JSON.parse(text); } catch { data = text.slice(0, 300); }
            return { status: res.status, data };
          };
          (async () => {
            const auth = await call("/auth/login", null, { username: "admin", password: process.env.UMAMI_ADMIN_PASSWORD });
            if (auth.status !== 200) throw new Error(`login failed (HTTP ${auth.status})`);
            const token = auth.data.token;
            const endAt = Date.now(), startAt = endAt - 24 * 3600 * 1000;
            const q = `startAt=${startAt}&endAt=${endAt}`;
            for (const [label, path] of [
              ["stats", `/websites/${SITE}/stats?${q}`],
              ["pages", `/websites/${SITE}/metrics?type=path&${q}`],
              ["events", `/websites/${SITE}/metrics?type=event&${q}`],
              ["event log", `/websites/${SITE}/events?${q}&pageSize=20`],
              ["event properties", `/websites/${SITE}/event-data/properties?${q}`],
            ]) {
              const r = await call(path, token);
              console.log(`\n== ${label} (HTTP ${r.status})`);
              console.log(JSON.stringify(r.data, null, 1).slice(0, 4000));
            }
          })().catch((e) => { console.error(e.message); process.exit(1); });
          EOF
