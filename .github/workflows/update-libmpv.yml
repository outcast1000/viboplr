name: Update libmpv

# Weekly: is there a newer libmpv build than the pinned one? If so, mirror it,
# re-pin it, prove it loads and plays on real macOS and Windows runners,
# repackage the downloadable engine component, open (or refresh) a pull request,
# run CI on it and merge it once that passes — so the new pin is on main the
# same day. The engine tests prove libmpv loads and plays, not that playback has
# no subtle regression; the release that ships it is where that gets tried
# (`npm run bump` Step 0 still merges a PR this run left open).
#
# Everything is re-derived from main each run, so a PR left open is simply
# refreshed — never stacked — and re-running is safe (mirroring checks bytes,
# the component publish never overwrites a file).

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

concurrency:
  group: update-libmpv
  cancel-in-progress: false

permissions:
  contents: write

env:
  BRANCH: bot/libmpv-update

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      platforms: ${{ steps.update.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # bsdtar reads the upstream .7z and .zip archives; GNU tar can't.
      - name: Install bsdtar
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Find, check and mirror newer builds
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-libmpv.mjs --write --mirror --summary libmpv-update.md

      # Through the API, not `git push`, so GitHub signs it (a verified commit by
      # github-actions[bot]): main's ruleset has "extra approval for
      # unattributed changes" on, which an unsigned bot commit may trip. It was
      # NOT what held #140 — that was the PR's CI waiting for approval (see the
      # merge step). --force: the branch is rebuilt from main every run.
      - name: Push the update branch
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/commit-via-api.mjs --branch "$BRANCH" --parent "$(git rev-parse HEAD)" --force \
            --message "build(libmpv): update pinned libmpv (${{ steps.update.outputs.platforms }})" \
            scripts/libmpv.lock.json

      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-update-summary
          path: libmpv-update.md

  engine-test:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Vendor libmpv
        run: node scripts/fetch-libmpv.mjs

      # The engine tests skip themselves when libmpv is absent — here that
      # would be a pass that proves nothing, so a skip fails the job.
      - name: Engine tests (real libmpv)
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --lib mpv_engine -- --nocapture 2>&1 | tee engine-test.log
          if grep -q "\[engine-test\] SKIPPED" engine-test.log; then
            echo "::error::engine tests were skipped — libmpv did not load"
            exit 1
          fi

  engine-component:
    needs: [check, engine-test]
    runs-on: macos-latest # the packager inspects the macOS dylib with otool
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0 # the publish script finds the root commit

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Vendor libmpv (all platforms)
        run: node scripts/fetch-libmpv.mjs --all

      - name: Package and publish the engine component
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/package-engine-component.mjs
          node scripts/publish-engine-components.mjs

      # Signed through the API for the same reason as the check job's commit.
      - name: Commit the component pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src-tauri/engine-component.lock.json; then exit 0; fi
          node scripts/commit-via-api.mjs --branch "$BRANCH" --parent "$(git rev-parse HEAD)" \
            --message "build(engine): re-pin the downloadable engine component" \
            src-tauri/engine-component.lock.json

  pull-request:
    needs: [check, engine-test, engine-component]
    if: always() && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # gh pr merge
      pull-requests: write
      actions: write # gh workflow run ci.yml
      checks: read # the PR's check rollup
      statuses: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: libmpv-update-summary

      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ needs.engine-test.result }}
          COMPONENT: ${{ needs.engine-component.result }}
        run: |
          mark() { [ "$1" = success ] && echo "✅ $1" || echo "❌ $1"; }
          {
            cat libmpv-update.md
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Engine tests on macOS + Windows (real libmpv) | $(mark "$TESTS") |"
            echo "| Engine component packaged + published | $(mark "$COMPONENT") |"
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "_Opened by the workflow, which merges this PR once its CI passes. If its CI is waiting for approval (\"Approve workflows to run\" above), approve it — the PR's own CI run is the one main's required checks count. If it stays open (a draft, or CI failed), \`npm run bump\` merges it once it isn't a draft and CI has passed._"
          } > body.md
          TITLE="Update libmpv (${{ needs.check.outputs.platforms }})"
          PASSED=true
          if [ "$TESTS" != success ] || [ "$COMPONENT" != success ]; then PASSED=false; fi
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file body.md
            # bump.mjs merges any non-draft PR whose CI passed, so the draft flag
            # must follow THIS run: a PR that passed once and failed now goes back
            # to draft, and one that failed before and passes now leaves it.
            # Not `|| true`: a failed re-draft would let bump merge a failed update.
            IS_DRAFT=$(gh pr view "$BRANCH" --json isDraft --jq .isDraft)
            if [ "$PASSED" = true ] && [ "$IS_DRAFT" = true ]; then gh pr ready "$BRANCH"; fi
            if [ "$PASSED" != true ] && [ "$IS_DRAFT" != true ]; then gh pr ready --undo "$BRANCH"; fi
          else
            DRAFT=""
            if [ "$PASSED" != true ]; then DRAFT="--draft"; fi
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file body.md $DRAFT
          fi

      # main's ruleset requires typecheck / rust-check-and-test / test-ts. The PR
      # does trigger CI (a pull_request run), but while github-actions[bot]
      # counts as a first-time contributor (repo policy first_time_contributors)
      # that run waits for a maintainer's approval — and it is the one the PR's
      # required checks count; this dispatched run's green checks don't satisfy
      # them (#140 sat BLOCKED with them until the held run was approved). This
      # run is still what the merge step's own verdict reads. Its runs
      # attach to the branch's head commit, which is what the PR's checks read.
      - name: Start CI on the branch
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run ci.yml --ref "$BRANCH"

      # Only a run whose own tests and component publish passed is merged — a
      # draft never is. The verdict is bump's own (requiredChecksState), so both
      # merge paths agree on what "CI passed" means, and the merge is pinned to
      # the commit CI tested: a push to the branch in between refuses it.
      - name: Wait for CI, then merge
        if: needs.engine-test.result == 'success' && needs.engine-component.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ci.outputs.sha }}
          SINCE: ${{ steps.ci.outputs.since }}
        run: |
          RUN=""
          for _ in $(seq 1 20); do
            RUN=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --json databaseId,headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$SHA\" and .createdAt >= \"$SINCE\")][0].databaseId // empty")
            [ -n "$RUN" ] && break
            sleep 15
          done
          if [ -z "$RUN" ]; then
            echo "::warning::CI run for $SHA never appeared — leaving the PR for npm run bump"
            exit 0
          fi
          gh run watch "$RUN" --interval 30 > /dev/null || true
          # The head commit's check runs over REST, never statusCheckRollup
          # (empty for every PR here — see checkRunsArgs).
          STATE=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" --jq .check_runs \
            | node --input-type=module -e '
                import { requiredChecksState } from "./scripts/lib/libmpvUpdate.mjs";
                let s = ""; for await (const c of process.stdin) s += c;
                console.log(requiredChecksState(JSON.parse(s)));')
          if [ "$STATE" != passed ]; then
            echo "::warning::CI on the branch is $STATE — leaving the PR open"
            exit 0
          fi
          gh pr merge "$BRANCH" --merge --match-head-commit "$SHA"
