name: Update libmpv

# Weekly: is there a newer libmpv build than the pinned one? If so, mirror it,
# re-pin it, prove it loads and plays on real macOS and Windows runners,
# repackage the downloadable engine component, open (or refresh) a pull request,
# wait for its CI and merge it once that passes — so the new pin is on main the
# same day. The engine tests prove libmpv loads and plays, not that playback has
# no subtle regression; the release that ships it is where that gets tried
# (`npm run bump` Step 0 still merges a PR this run left open).
#
# Everything is re-derived from main each run, so a PR left open is simply
# refreshed — never stacked — and re-running is safe (mirroring checks bytes,
# the component publish never overwrites a file).
#
# The branch commits and the PR are made as the Vibo bot GitHub App (repo
# variable BOT_APP_ID + secret BOT_APP_PRIVATE_KEY), never with github.token.
# A pull_request run started by a github.token event is held at "Approve
# workflows to run" (github-actions[bot] counts as a first-time contributor
# under the repo's approval policy), and that held run is the one main's
# required checks count — so every update PR sat BLOCKED until someone clicked
# (#140, #141). An App's events start CI like a person's. The App needs
# Contents and Pull requests read/write on this repo. Each job mints its own
# token: they last an hour and can't be passed between jobs.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

concurrency:
  group: update-libmpv
  cancel-in-progress: false

permissions:
  contents: write

env:
  BRANCH: bot/libmpv-update

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      platforms: ${{ steps.update.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # bsdtar reads the upstream .7z and .zip archives; GNU tar can't.
      - name: Install bsdtar
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Find, check and mirror newer builds
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-libmpv.mjs --write --mirror --summary libmpv-update.md

      # Only when there is something to push, and only now: a week with no
      # update never needs the App, and a token minted before the mirror step
      # could expire (1h) before the push.
      - name: Bot token
        if: steps.update.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Through the API, not `git push`, so GitHub signs it (a verified commit by
      # the bot App — an App token's API commit is signed, a personal token's
      # isn't): main's ruleset has "extra approval for unattributed changes"
      # on, which an unsigned commit may trip. The App token matters twice
      # here: on a PR that's already open this push is the `synchronize` that
      # starts its CI, and with github.token that run would be held.
      # --force: the branch is rebuilt from main every run.
      - name: Push the update branch
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node scripts/commit-via-api.mjs --branch "$BRANCH" --parent "$(git rev-parse HEAD)" --force \
            --message "build(libmpv): update pinned libmpv (${{ steps.update.outputs.platforms }})" \
            scripts/libmpv.lock.json

      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-update-summary
          path: libmpv-update.md

  engine-test:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Vendor libmpv
        run: node scripts/fetch-libmpv.mjs

      # The engine tests skip themselves when libmpv is absent — here that
      # would be a pass that proves nothing, so a skip fails the job.
      - name: Engine tests (real libmpv)
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --lib mpv_engine -- --nocapture 2>&1 | tee engine-test.log
          if grep -q "\[engine-test\] SKIPPED" engine-test.log; then
            echo "::error::engine tests were skipped — libmpv did not load"
            exit 1
          fi

  engine-component:
    needs: [check, engine-test]
    runs-on: macos-latest # the packager inspects the macOS dylib with otool
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0 # the publish script finds the root commit

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Vendor libmpv (all platforms)
        run: node scripts/fetch-libmpv.mjs --all

      - name: Package and publish the engine component
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/package-engine-component.mjs
          node scripts/publish-engine-components.mjs

      # Minted right before its one use, like the check job's.
      - name: Bot token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Signed through the API, as the bot App, for the same reasons as the
      # check job's commit.
      - name: Commit the component pins
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if git diff --quiet -- src-tauri/engine-component.lock.json; then exit 0; fi
          node scripts/commit-via-api.mjs --branch "$BRANCH" --parent "$(git rev-parse HEAD)" \
            --message "build(engine): re-pin the downloadable engine component" \
            src-tauri/engine-component.lock.json

  pull-request:
    needs: [check, engine-test, engine-component]
    if: always() && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # CI alone can run ~70 min on a crawling Ubuntu mirror (the apt step may
    # take 45); the watch below gives up at 100 so the job ends on its own
    # "leaving the PR open" warning rather than being killed.
    timeout-minutes: 120
    permissions:
      contents: write # gh pr merge
      pull-requests: write
      actions: read # gh run list / watch
      checks: read # the PR's check rollup
      statuses: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: libmpv-update-summary

      - name: Bot token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # As the bot App, so opening the PR starts its CI without an approval.
      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TESTS: ${{ needs.engine-test.result }}
          COMPONENT: ${{ needs.engine-component.result }}
        run: |
          mark() { [ "$1" = success ] && echo "✅ $1" || echo "❌ $1"; }
          {
            cat libmpv-update.md
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Engine tests on macOS + Windows (real libmpv) | $(mark "$TESTS") |"
            echo "| Engine component packaged + published | $(mark "$COMPONENT") |"
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "_Opened by the workflow, which merges this PR once its CI passes. If it stays open (a draft, or CI failed), \`npm run bump\` merges it once it isn't a draft and CI has passed._"
          } > body.md
          TITLE="Update libmpv (${{ needs.check.outputs.platforms }})"
          PASSED=true
          if [ "$TESTS" != success ] || [ "$COMPONENT" != success ]; then PASSED=false; fi
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file body.md
            # bump.mjs merges any non-draft PR whose CI passed, so the draft flag
            # must follow THIS run: a PR that passed once and failed now goes back
            # to draft, and one that failed before and passes now leaves it.
            # Not `|| true`: a failed re-draft would let bump merge a failed update.
            IS_DRAFT=$(gh pr view "$BRANCH" --json isDraft --jq .isDraft)
            if [ "$PASSED" = true ] && [ "$IS_DRAFT" = true ]; then gh pr ready "$BRANCH"; fi
            if [ "$PASSED" != true ] && [ "$IS_DRAFT" != true ]; then gh pr ready --undo "$BRANCH"; fi
          else
            DRAFT=""
            if [ "$PASSED" != true ]; then DRAFT="--draft"; fi
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file body.md $DRAFT
          fi

      # Only a run whose own tests and component publish passed is merged — a
      # draft never is. The CI watched is the PR's own pull_request run, the
      # one main's ruleset counts; the bot App's push / PR open started it (see
      # the header), so nothing is dispatched here. The verdict is bump's own
      # (requiredChecksState), so both merge paths agree on what "CI passed"
      # means, and the merge is pinned to the commit CI tested: a push to the
      # branch in between refuses it.
      - name: Wait for CI, then merge
        if: needs.engine-test.result == 'success' && needs.engine-component.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          RUN=""
          for _ in $(seq 1 20); do
            RUN=$(gh run list --workflow ci.yml --branch "$BRANCH" --event pull_request \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$SHA\")][0].databaseId // empty")
            [ -n "$RUN" ] && break
            sleep 15
          done
          if [ -z "$RUN" ]; then
            echo "::warning::No CI run started for $SHA — is the bot App installed? Leaving the PR for npm run bump"
            exit 0
          fi
          timeout 100m gh run watch "$RUN" --interval 30 > /dev/null || true
          # The head commit's check runs over REST, never statusCheckRollup
          # (empty for every PR here — see checkRunsArgs).
          STATE=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" --jq .check_runs \
            | node --input-type=module -e '
                import { requiredChecksState } from "./scripts/lib/libmpvUpdate.mjs";
                let s = ""; for await (const c of process.stdin) s += c;
                console.log(requiredChecksState(JSON.parse(s)));')
          if [ "$STATE" != passed ]; then
            echo "::warning::CI on the branch is $STATE — leaving the PR open"
            exit 0
          fi
          gh pr merge "$BRANCH" --merge --match-head-commit "$SHA"
