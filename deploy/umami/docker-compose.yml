# Self-hosted Umami (cookieless web analytics for the viboplr.com site).
#
# Deployed by .github/workflows/deploy-umami.yml (rsync this folder, then
# setup.sh on the VPS). Secrets live in .env on the VPS only — setup.sh
# generates it on the first run and never overwrites it.
#
# The `umami` service joins the shared `nginx-proxy-manager` network so NPM can
# proxy https://stats.viboplr.com -> http://umami:3000. No host port is
# published: until the admin password is changed (setup.sh does that through
# `docker compose exec`), nothing outside the VPS can reach the dashboard.
services:
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    container_name: umami
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - nginx-proxy-manager

  db:
    image: postgres:15-alpine
    container_name: umami-db
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

volumes:
  umami-db:

networks:
  # Private network for app <-> database.
  internal:
  # Existing Nginx Proxy Manager network (shared with the site and Aptabase).
  nginx-proxy-manager:
    external: true
